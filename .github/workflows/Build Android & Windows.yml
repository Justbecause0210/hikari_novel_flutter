name: Build Android & Windows

on:
  workflow_dispatch:

jobs:
  # 1. Android 端（分开编译 64位 arm64-v8a 和 32位 armeabi-v7a，并自动带上版本号）
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract App Version
        id: version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SAFE_VER=$(echo "$RAW_VER" | tr '+' '-')
          echo "app_version=$SAFE_VER" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with Version
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/HikariNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/HikariNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a.apk

      - name: Upload Android arm64-v8a (64位)
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a
          path: build/app/outputs/flutter-apk/HikariNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a.apk

      - name: Upload Android armeabi-v7a (32位)
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/HikariNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a.apk

  # 2. Windows 端（产物名带上版本号，解压后直接运行 hikari_novel_flutter.exe）
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SAFE_VER=$(echo "$RAW_VER" | tr '+' '-')
          echo "app_version=$SAFE_VER" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-${{ steps.version.outputs.app_version }}-Windows-x64
          path: build/windows/x64/runner/Release/
