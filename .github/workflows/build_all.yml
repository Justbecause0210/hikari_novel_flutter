name: Build All Supported Platforms

on:
  workflow_dispatch:

jobs:
  # 1. Android 端（分开编译 64位 arm64-v8a 和 32位 armeabi-v7a）
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs (arm64-v8a & armeabi-v7a)
        run: flutter build apk --release --split-per-abi

      - name: Upload Android arm64-v8a (64位)
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-Android-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload Android armeabi-v7a (32位)
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  # 2. Windows 端（输出完整 Release 目录，解压后直接运行 hikari_novel_flutter.exe）
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-Windows-x64
          path: build/windows/x64/runner/Release/

  # 3. macOS 端（理论支持，未做键鼠适配）
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Upload macOS App
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-macOS
          path: build/macos/Build/Products/Release/*.app

  # 4. iOS 端（输出未签名 IPA，需使用爱思助手/AltStore 自签安装）
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS No-Codesign
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r HikariNovel-iOS-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v5
        with:
          name: HikariNovel-iOS-unsigned
          path: HikariNovel-iOS-unsigned.ipa
